<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d6e5a" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Subtle inner border -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#6ee7b7" stroke-width="4" stroke-opacity="0.25" />
  
  <!-- Wallet / Ledger card icon -->
  <g transform="translate(96, 96)">
    <!-- Base folder / wallet -->
    <rect x="20" y="50" width="280" height="220" rx="36" fill="white" opacity="0.12" />
    <rect x="35" y="70" width="250" height="200" rx="32" fill="white" opacity="0.95" />
    
    <!-- Accent band -->
    <path d="M 35 120 L 285 120 L 285 170 L 35 170 Z" fill="url(#cardGrad)" opacity="0.9" />
    
    <!-- Currency / Expense Emblem -->
    <circle cx="210" cy="145" r="22" fill="#0d6e5a" />
    <text x="210" y="153" font-size="24" font-weight="900" fill="#ffffff" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">₹</text>
    
    <!-- Growth Arrow / Plus badge -->
    <g transform="translate(60, 190)">
      <circle cx="30" cy="30" r="28" fill="#10b981" />
      <path d="M 22 30 L 38 30 M 30 22 L 30 38" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
    </g>
    
    <!-- Daily tracker calendar badge top left -->
    <rect x="50" y="25" width="80" height="55" rx="14" fill="#0d6e5a" stroke="#6ee7b7" stroke-width="3" />
    <text x="90" y="60" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">31</text>
  </g>
</svg>
